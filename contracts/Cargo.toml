[workspace]
resolver = "2"
members = ["barrel", "barrel-core", "attestor", "attest-core", "test-usdc"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true

# Quote verification is signature-heavy. Built for speed it costs about 40%
# less gas than built for size, which is what keeps it inside one transaction.
# Only the crates on that path are built this way; the rest stay small.
[profile.release.package.attest-core]
opt-level = 3
[profile.release.package.dcap-qvl]
opt-level = 3
[profile.release.package.dcap-qvl-webpki]
opt-level = 3
[profile.release.package.p256]
opt-level = 3
[profile.release.package.primeorder]
opt-level = 3
[profile.release.package.elliptic-curve]
opt-level = 3
[profile.release.package.crypto-bigint]
opt-level = 3
[profile.release.package.ecdsa]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
