[package]
name = "attest-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The attestation checks Barrel's attestor contract runs, free of chain dependencies so they can be tested natively against real reports."

[dependencies]
hex = "0.4"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
dcap-qvl = { version = "0.7.1", default-features = false, features = ["std", "rustcrypto", "default-x509", "contract"] }

[dev-dependencies]
serde_json = "1"
